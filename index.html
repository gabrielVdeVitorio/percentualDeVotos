<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Calcule os percentuais de votos da eleição</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Calcule os percentuais de votos da eleição">
    <meta name="keywords" content="votos, percentual, eleicao">
    <meta name="description" content="Calcula o percentual de votos brancos, nulos e válidos em relação ao total de votos.">
    <meta name="author" content="Gabriel Vitório dos Santos">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <main class="container">
        <form id="userForm">
            <div id="form__div--brancos" class="form__div--inputs">
                <label for="Brancos">Digite a quantidade de votos em branco:</label>
                <input id="div__input--brancos" placeholder="Digite os votos em branco" type="number" name="Brancos">
            </div>

            <div id="form__div--nulos" class="form__div--inputs">
                <label for="Nulos">Digite a quantidade de votos em nulos:</label>
                <input id="div__input--nulos" placeholder="Digite os votos nulos" type="number" name="Nulos">
            </div>

            <div id="form__div--validos" class="form__div--inputs">
                <label for="Validos">Digite a quantidade de votos válidos:</label>
                <input id="div__input--validos" placeholder="Digite os votos válidos" type="number" name="Validos">
            </div>
            <hr/>
            <div>
                <p id="div__p--resultado"></p>
            </div>
        </form>
        
    </main>
</body>
</html>
